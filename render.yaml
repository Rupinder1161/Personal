services:
  - type: web
    name: moneyhub-api
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: moneyhub-db
          property: connectionString

databases:
  - name: moneyhub-db
    databaseName: moneyhub
    user: moneyhub
    plan: free
